# Evaluation set v1 (FR-EVL-01). See docs/evaluation/index.md for how it is scored.
#
# analytical:   reference_sql returns the correct rows as (label, value) or (value);
#               the answer is correct when every reference row appears in the API's
#               analytics rows (labels compared case-insensitively).
# semantic etc: relevant describes which jobs in Gold are relevant, as filters over
#               gold.posting_documents; retrieval is scored against that set.
# resume:       expected_skills must be extracted from resume_text; every match must
#               respect the filters.
version: 1
created: 2026-11-06
questions:

  # --- Analytical: counts and rankings (10) -----------------------------------
  - id: EV-001
    category: analytical_counts
    question: Which 10 skills are most requested across all jobs?
    expected_route: analytical
    reference_sql: |
      select s.skill_name, count(*) from gold.fct_posting_skills ps
      join gold.dim_skill s using (skill_key) group by 1 order by 2 desc, 1 limit 10
    notes: Basic ranking over deduplicated jobs.

  - id: EV-002
    category: analytical_counts
    question: What are the most in-demand skills for data engineer roles?
    expected_route: analytical
    reference_sql: |
      select s.skill_name, count(*) from gold.fct_postings f
      join gold.fct_posting_skills ps using (posting_key) join gold.dim_skill s using (skill_key)
      where lower(f.title) like '%data engineer%' group by 1 order by 2 desc, 1 limit 5
    notes: Role filter through title keywords.

  - id: EV-003
    category: analytical_counts
    question: How many data and AI jobs are there in Hyderabad?
    expected_route: analytical
    reference_sql: |
      select count(*) from gold.fct_postings where location_key = 'hyderabad'
    notes: City filter; reposts counted once.

  - id: EV-004
    category: analytical_counts
    question: Is demand for Databricks higher in Hyderabad or Bengaluru?
    expected_route: analytical
    reference_sql: |
      select l.city, count(*) from gold.fct_postings f join gold.dim_location l using (location_key)
      join gold.fct_posting_skills ps using (posting_key)
      where ps.skill_key = 'databricks' and l.city in ('Hyderabad', 'Bengaluru') group by 1
    notes: PRD example question; compare_cities with a skill.

  - id: EV-005
    category: analytical_counts
    question: Which companies have the most data and AI job openings?
    expected_route: analytical
    reference_sql: |
      select c.company_name, count(*) from gold.fct_postings f join gold.dim_company c using (company_key)
      group by 1 order by 2 desc, 1 limit 5
    notes: Company normalisation (FR-TRN-04).

  - id: EV-006
    category: analytical_counts
    question: How many remote roles are there?
    expected_route: analytical
    reference_sql: |
      select count(*) from gold.fct_postings where work_mode = 'remote'
    notes: Inferred work mode (FR-TRN-06).

  - id: EV-007
    category: analytical_counts
    question: How are jobs in Bengaluru split by seniority?
    expected_route: analytical
    reference_sql: |
      select seniority, count(*) from gold.fct_postings where location_key = 'bengaluru' group by 1
    notes: Inferred seniority, grouped.

  - id: EV-008
    category: analytical_counts
    question: How many jobs mention both dbt and Snowflake?
    expected_route: analytical
    reference_sql: |
      select count(*) from gold.fct_postings f
      where posting_key in (select posting_key from gold.fct_posting_skills where skill_key = 'dbt')
        and posting_key in (select posting_key from gold.fct_posting_skills where skill_key = 'snowflake')
    notes: Two skills combined with AND.

  - id: EV-009
    category: analytical_counts
    question: What are the top 5 skills for machine learning engineer roles in Bengaluru?
    expected_route: analytical
    reference_sql: |
      select s.skill_name, count(*) from gold.fct_postings f
      join gold.fct_posting_skills ps using (posting_key) join gold.dim_skill s using (skill_key)
      where lower(f.title) like '%machine learning engineer%' and f.location_key = 'bengaluru'
      group by 1 order by 2 desc, 1 limit 5
    notes: Role and city filters together.

  - id: EV-010
    category: analytical_counts
    question: How many hybrid jobs are there in each city?
    expected_route: analytical
    reference_sql: |
      select l.city, count(*) from gold.fct_postings f join gold.dim_location l using (location_key)
      where f.work_mode = 'hybrid' group by 1
    notes: Filter plus grouping by city.

  # --- Analytical: trends over time (6) ----------------------------------------
  - id: EV-011
    category: analytical_trends
    question: How has demand for dbt changed month by month?
    expected_route: analytical
    reference_sql: |
      select date_trunc('month', f.posted_date), count(*) from gold.fct_postings f
      join gold.fct_posting_skills ps using (posting_key)
      where ps.skill_key = 'dbt' and f.posted_date is not null group by 1
    notes: Monthly skill trend.

  - id: EV-012
    category: analytical_trends
    question: How many jobs mentioning Kafka were posted each month?
    expected_route: analytical
    reference_sql: |
      select date_trunc('month', f.posted_date), count(*) from gold.fct_postings f
      join gold.fct_posting_skills ps using (posting_key)
      where ps.skill_key = 'kafka' and f.posted_date is not null group by 1
    notes: Skill alias "Kafka" must map to Apache Kafka.

  - id: EV-013
    category: analytical_trends
    question: How many jobs were posted each week in Bengaluru?
    expected_route: analytical
    reference_sql: |
      select date_trunc('week', posted_date), count(*) from gold.fct_postings
      where location_key = 'bengaluru' and posted_date is not null group by 1
    notes: PRD example, weekly grain.

  - id: EV-014
    category: analytical_trends
    question: How many analytics engineer roles were posted each month?
    expected_route: analytical
    reference_sql: |
      select date_trunc('month', posted_date), count(*) from gold.fct_postings
      where lower(title) like '%analytics engineer%' and posted_date is not null group by 1
    notes: Role trend.

  - id: EV-015
    category: analytical_trends
    question: Show the monthly trend of jobs that mention LLMs.
    expected_route: analytical
    reference_sql: |
      select date_trunc('month', f.posted_date), count(*) from gold.fct_postings f
      join gold.fct_posting_skills ps using (posting_key)
      where ps.skill_key = 'llm' and f.posted_date is not null group by 1
    notes: GenAI skill trend.

  - id: EV-016
    category: analytical_trends
    question: How many jobs were posted in the last 30 days?
    expected_route: analytical
    reference_sql: |
      select count(*) from gold.fct_postings where posted_date >= current_date - 30
    notes: Relative date window.

