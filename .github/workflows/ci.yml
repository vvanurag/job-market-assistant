name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,transform]"

      - name: Pre-commit hooks (style, secrets, file hygiene)
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Tests
        run: pytest

      - name: dbt project compiles
        working-directory: transform
        run: dbt parse --profiles-dir . --target dev

      - name: Documentation builds
        run: mkdocs build --strict
