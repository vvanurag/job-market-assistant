version: 2

seeds:
  - name: city_aliases
    description: >
      Maps text found in posting locations to a canonical target city (FR-TRN-12).
      match_level ranks how specific the match is: a city name beats an area name,
      which beats a state-only location such as "Telangana, India".
    config:
      column_types:
        alias: varchar
        city: varchar
        match_level: varchar
    columns:
      - name: alias
        description: Lowercase text to look for in the location string.
        data_tests: [unique, not_null]
      - name: city
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Hyderabad", "Bengaluru"]
      - name: match_level
        data_tests:
          - accepted_values:
              arguments:
                values: ["city", "area", "state"]

  - name: skills
    description: >
      The skill dictionary (FR-TRN-05). One row per skill. `pattern` is a lowercase
      regular expression; alternatives are separated by "|". Patterns must not contain
      backslashes (use [.] or [+]) so they work in both DuckDB and Snowflake. The model
      adds whole-word boundaries, so don't add them here.
    config:
      column_types:
        skill_id: varchar
        skill_name: varchar
        category: varchar
        pattern: varchar
    columns:
      - name: skill_id
        data_tests: [unique, not_null]
      - name: skill_name
        data_tests: [unique, not_null]
      - name: category
        data_tests: [not_null]
      - name: pattern
        data_tests: [not_null]
