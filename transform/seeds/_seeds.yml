version: 2

seeds:
  - name: city_aliases
    description: >
      Maps text found in posting locations to a canonical target city (FR-TRN-12).
      match_level ranks how specific the match is: a city name beats an area name,
      which beats a state-only location such as "Telangana, India", which beats a remote
      role open to candidates in India (open question Q6).
    config:
      column_types:
        alias: varchar
        city: varchar
        match_level: varchar
    columns:
      - name: alias
        description: Lowercase text to look for in the location string.
        data_tests: [unique, not_null]
      - name: city
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Hyderabad", "Bengaluru", "Remote (India)"]
      - name: match_level
        data_tests:
          - accepted_values:
              arguments:
                values: ["city", "area", "state", "remote"]

  - name: skills
    description: >
      The skill dictionary (FR-TRN-05). One row per skill. `pattern` is a lowercase
      regular expression; alternatives are separated by "|". Patterns must not contain
      backslashes (use [.] or [+]) so they work in both DuckDB and Snowflake. The model
      adds whole-word boundaries, so don't add them here.
    config:
      column_types:
        skill_id: varchar
        skill_name: varchar
        category: varchar
        pattern: varchar
    columns:
      - name: skill_id
        data_tests: [unique, not_null]
      - name: skill_name
        data_tests: [unique, not_null]
      - name: category
        data_tests: [not_null]
      - name: pattern
        data_tests: [not_null]

  - name: seniority_rules
    description: >
      Ordered rules for inferring seniority (FR-TRN-06). A posting takes the first rule
      (lowest rule_order) whose pattern matches its field: "title" is the job title,
      "source" is the source's own level, used only where it names a single level.
      Patterns follow the same rules as the skill dictionary: lowercase, no
      backslashes, whole-word boundaries added by the model.
    config:
      column_types:
        rule_order: integer
        seniority: varchar
        field: varchar
        pattern: varchar
    columns:
      - name: rule_order
        data_tests: [unique, not_null]
      - name: seniority
        data_tests:
          - accepted_values:
              arguments:
                values: ["intern", "junior", "mid", "senior", "lead", "manager"]
      - name: field
        data_tests:
          - accepted_values:
              arguments:
                values: ["title", "source"]
      - name: pattern
        data_tests: [not_null]

  - name: work_mode_rules
    description: >
      Ordered rules for inferring work mode (FR-TRN-06). "title_location" is the title
      and location together; "description" is the cleaned description. Phrases use
      [[:space:]]+ between words because descriptions contain line breaks.
    config:
      column_types:
        rule_order: integer
        work_mode: varchar
        field: varchar
        pattern: varchar
    columns:
      - name: rule_order
        data_tests: [unique, not_null]
      - name: work_mode
        data_tests:
          - accepted_values:
              arguments:
                values: ["remote", "hybrid", "on-site"]
      - name: field
        data_tests:
          - accepted_values:
              arguments:
                values: ["title_location", "description"]
      - name: pattern
        data_tests: [not_null]

  - name: sources
    description: >
      Recurring sources and their details, for dim_source. A source missing from this
      list is treated as the one-off initial backfill.
    columns:
      - name: source_id
        data_tests: [unique, not_null]
      - name: collection
        data_tests:
          - accepted_values:
              arguments:
                values: ["daily", "one-off"]
