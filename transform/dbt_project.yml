name: jobmarket
version: "0.1.0"
config-version: 2
profile: jobmarket

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  jobmarket:
    staging:
      +schema: silver
      +materialized: view
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: table

vars:
  # Calendar range for dim_date; covers every posting date seen so far, with headroom
  date_spine_start: "2019-01-01"
  date_spine_end: "2027-12-31"

seeds:
  jobmarket:
    +schema: silver
