version: 2

models:
  - name: fct_postings
    description: >
      One row per unique data/AI job in Hyderabad, Bengaluru or remote in India, target
      roles only. Reposts and cross-source copies are counted once (FR-TRN-03).
    columns:
      - name: posting_key
        data_tests: [unique, not_null]
      - name: company_key
        data_tests:
          - not_null
          - relationships:
              arguments: { to: ref('dim_company'), field: company_key }
      - name: location_key
        data_tests:
          - not_null
          - relationships:
              arguments: { to: ref('dim_location'), field: location_key }
      - name: posted_date_key
        data_tests:
          - not_null
          - relationships:
              arguments: { to: ref('dim_date'), field: date_key }
      - name: source_key
        data_tests:
          - not_null
          - relationships:
              arguments: { to: ref('dim_source'), field: source_key }
      - name: status
        description: open or closed, from the current version in slv_posting_history (FR-TRN-09).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["open", "closed"]
      - name: first_seen_at
        description: When the posting was first collected.
        data_tests: [not_null]
      - name: last_seen_at
        description: When a source last returned the posting.
      - name: version_count
        description: Number of history versions; more than 1 means it changed or closed.
      - name: posted_date_is_estimated
        description: True when the source gave no publish date and the first-loaded date is used instead.
        data_tests: [not_null]
      - name: seniority
        description: Inferred level (FR-TRN-06); see slv_posting_attributes for how. 'unknown' when there is no evidence.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["intern", "junior", "mid", "senior", "lead", "manager", "unknown"]
      - name: seniority_basis
        description: What decided the seniority — title, source, experience or none.
      - name: min_years_experience
        description: Minimum years of experience asked for, when the description states it.
      - name: work_mode
        description: Remote, hybrid or on-site, when the posting says so; otherwise 'unknown'.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["remote", "hybrid", "on-site", "unknown"]
      - name: work_mode_basis
        description: Where the work mode was found — title_location, description or none.
      - name: repost_count
        description: How many other postings (reposts, or copies on other sources) are the same job.
      - name: sources_in_job
        description: Number of sources the job was found on.
      - name: skill_count
        description: Number of dictionary skills the posting mentions.

  - name: fct_posting_skills
    description: >
      One row per (unique job, skill). Company, city and date keys are copied from
      fct_postings so common questions need no extra joins.
    data_tests:
      - unique:
          column_name: "posting_key || '|' || skill_key"
    columns:
      - name: posting_key
        data_tests:
          - not_null
          - relationships:
              arguments: { to: ref('fct_postings'), field: posting_key }
      - name: skill_key
        data_tests:
          - not_null
          - relationships:
              arguments: { to: ref('dim_skill'), field: skill_key }

  - name: dim_company
    description: One row per company after name normalisation (FR-TRN-04).
    columns:
      - name: company_key
        data_tests: [unique, not_null]
      - name: normalized_name
        data_tests: [unique, not_null]
      - name: company_name
        description: The most common original spelling, for display.
      - name: spelling_variants
        description: How many different original spellings were merged into this company.

  - name: dim_source
    description: One row per source of postings (FR-TRN-10).
    columns:
      - name: source_key
        data_tests: [unique, not_null]
      - name: collection
        data_tests:
          - accepted_values:
              arguments:
                values: ["daily", "one-off"]

  - name: dim_skill
    description: One row per skill in the dictionary.
    columns:
      - name: skill_key
        data_tests: [unique, not_null]

  - name: dim_location
    description: One row per target location — Hyderabad, Bengaluru and Remote (India).
    columns:
      - name: location_key
        data_tests: [unique, not_null]

  - name: dim_date
    description: One row per calendar day between the date_spine_start and date_spine_end variables.
    columns:
      - name: date_key
        description: Integer YYYYMMDD.
        data_tests: [unique, not_null]
      - name: date_day
        data_tests: [unique, not_null]

  - name: posting_documents
    description: >
      One row per unique job with its cleaned description and index metadata
      (FR-IDX-02). Source for the retrieval index and the API's posting details.
    columns:
      - name: posting_key
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments: { to: ref('fct_postings'), field: posting_key }
      - name: description_text
        data_tests: [not_null]
      - name: document_hash
        description: Changes only when embedded text changes (FR-IDX-04).
        data_tests: [not_null]
      - name: skills
        description: Skill names separated by "|".

  - name: posting_versions
    description: Version history of each job's representative posting, for "is it still open, has it changed?" (US-10).
    columns:
      - name: posting_version_key
        data_tests: [unique, not_null]
      - name: posting_key
        data_tests:
          - not_null
          - relationships:
              arguments: { to: ref('fct_postings'), field: posting_key }
